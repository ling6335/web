<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ef" />
    <title>拾页 · 个人阅读清单</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="拾页首页"><span class="brand-icon">拾</span><span>拾页</span></a>
      <span class="topbar-note">留一点时间，读一点好东西</span>
      <span class="topbar-local"><span class="status-dot"></span>仅保存在本地</span>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">YOUR PERSONAL READING LIST</p>
        <h1 id="page-title">把想读的，<span>一页页收好。</span></h1>
        <p class="intro-copy">遇见一篇好文章，就放进清单里。留给那个刚刚好的阅读时刻。</p>
      </section>

      <section class="add-card" aria-labelledby="form-title">
        <div class="section-heading"><span class="heading-mark">＋</span><h2 id="form-title">收进一篇新文章</h2></div>
        <form id="article-form" novalidate>
          <label class="field-label" for="title">文章标题</label>
          <input id="title" name="title" type="text" maxlength="200" placeholder="给这篇文章起个名字" required />
          <label class="field-label url-label" for="url">文章链接</label>
          <div class="url-input-wrap"><span class="url-icon" aria-hidden="true">↗</span><input id="url" name="url" type="url" maxlength="2048" placeholder="https://example.com/article" required /></div>
          <div class="form-footer"><p id="form-message" class="form-message" role="status" aria-live="polite"></p><button type="submit"><span>加入阅读清单</span><span class="button-arrow" aria-hidden="true">↗</span></button></div>
        </form>
      </section>

      <section class="list-section" aria-labelledby="list-title">
        <div class="list-heading"><div><p class="eyebrow list-eyebrow">SAVED FOR LATER</p><h2 id="list-title">待读文章 <span id="article-count" class="count-badge">0</span></h2></div><span class="list-caption">好文章，值得慢慢读</span></div>
        <div id="article-list" class="article-list" aria-live="polite" aria-busy="true"></div>
      </section>
      <footer class="page-footer"><span class="footer-sparkle">✳</span> 每一页，都从一次好奇开始。</footer>
    </main>
  </body>
</html>
